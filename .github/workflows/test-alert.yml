name: test-alert
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          now=$(date +%s)
          printf 'DATA {"coin": "SOL", "strategy": "cascade", "event_t": %d, "signal_t": %d, "px": 0, "z": 5.8, "vr": 3.1, "test": true}\n\nDry run, not a real signal. This is exactly how a live alert arrives (posted by the scanner bot).\n' $((now-1200)) $((now-180)) > body.txt
          gh issue create -R "$GITHUB_REPOSITORY" --label test --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "[test] DRY RUN: Rebound setup SOL (age 3m)" --body-file body.txt
