name: scan
on:
  schedule:
    - cron: '7 */2 * * *'      # backup starter only; the loop below does the 5-minute scanning
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: scan loop (every 5 minutes)
        run: ./loop.sh
        env:
          IA_BARS: '1300'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: hand off to the next loop
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run scan.yml -R "$GITHUB_REPOSITORY" --ref main
